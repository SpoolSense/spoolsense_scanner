name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  native-tests:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native test suite
        run: make -C test/native test

  firmware:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32s3zero, esp32c3, esp32s3devkitc, esp32c6, esp32c5, seeed_xiao_esp32c6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-py3.11-pio6.1.19-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Provide UserConfig
        run: cp include/UserConfig.example.h include/UserConfig.h
      - name: Build
        run: pio run -e ${{ matrix.env }}
      - name: Flash budget
        run: python scripts/check_flash_budget.py ${{ matrix.env }}
