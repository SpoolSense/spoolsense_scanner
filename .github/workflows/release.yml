name: Build and Release Firmware

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Copy example config for build
        run: cp include/UserConfig.example.h include/UserConfig.h

      # Build each env and stage its artifacts IMMEDIATELY. Building all four
      # first and copying at the end let a later env's build evict the earliest
      # env's firmware.bin from the runner (silent, no ENOSPC) — copy while fresh.
      - name: Build + stage ESP32-WROOM
        run: |
          pio run -e esp32dev
          python scripts/check_flash_budget.py esp32dev
          mkdir -p release
          cp .pio/build/esp32dev/firmware.bin   release/spoolsense_scanner_esp32dev.bin
          cp .pio/build/esp32dev/bootloader.bin release/bootloader_esp32dev.bin
          cp .pio/build/esp32dev/partitions.bin release/partitions_esp32dev.bin

      - name: Build + stage ESP32-S3-Zero
        run: |
          pio run -e esp32s3zero
          python scripts/check_flash_budget.py esp32s3zero
          cp .pio/build/esp32s3zero/firmware.bin   release/spoolsense_scanner_esp32s3zero.bin
          cp .pio/build/esp32s3zero/bootloader.bin release/bootloader_esp32s3zero.bin
          cp .pio/build/esp32s3zero/partitions.bin release/partitions_esp32s3zero.bin

      - name: Build + stage ESP32-S3-DevKitC
        run: |
          pio run -e esp32s3devkitc
          python scripts/check_flash_budget.py esp32s3devkitc
          cp .pio/build/esp32s3devkitc/firmware.bin   release/spoolsense_scanner_esp32s3devkitc.bin
          cp .pio/build/esp32s3devkitc/bootloader.bin release/bootloader_esp32s3devkitc.bin
          cp .pio/build/esp32s3devkitc/partitions.bin release/partitions_esp32s3devkitc.bin

      - name: Build + stage ESP32-C3
        run: |
          pio run -e esp32c3
          python scripts/check_flash_budget.py esp32c3
          cp .pio/build/esp32c3/firmware.bin   release/spoolsense_scanner_esp32c3.bin
          cp .pio/build/esp32c3/bootloader.bin release/bootloader_esp32c3.bin
          cp .pio/build/esp32c3/partitions.bin release/partitions_esp32c3.bin

      - name: Build + stage ESP32-C6
        run: |
          pio run -e esp32c6
          python scripts/check_flash_budget.py esp32c6
          cp .pio/build/esp32c6/firmware.bin   release/spoolsense_scanner_esp32c6.bin
          cp .pio/build/esp32c6/bootloader.bin release/bootloader_esp32c6.bin
          cp .pio/build/esp32c6/partitions.bin release/partitions_esp32c6.bin

      - name: Build + stage ESP32-C5
        run: |
          pio run -e esp32c5
          python scripts/check_flash_budget.py esp32c5
          cp .pio/build/esp32c5/firmware.bin   release/spoolsense_scanner_esp32c5.bin
          cp .pio/build/esp32c5/bootloader.bin release/bootloader_esp32c5.bin
          cp .pio/build/esp32c5/partitions.bin release/partitions_esp32c5.bin

      - name: Build + stage Seeed XIAO ESP32-C6
        run: |
          pio run -e seeed_xiao_esp32c6
          python scripts/check_flash_budget.py seeed_xiao_esp32c6
          cp .pio/build/seeed_xiao_esp32c6/firmware.bin   release/spoolsense_scanner_seeed_xiao_esp32c6.bin
          cp .pio/build/seeed_xiao_esp32c6/bootloader.bin release/bootloader_seeed_xiao_esp32c6.bin
          cp .pio/build/seeed_xiao_esp32c6/partitions.bin release/partitions_seeed_xiao_esp32c6.bin

      - name: Prepare release artifacts
        run: |
          # All firmware/bootloader/partition .bins were staged as each env
          # built; here we just add the checksums and partition schema.
          # Integrity sidecars — the installer (v1.4.0+) verifies downloads
          # against these and fails closed on mismatch (#227)
          cd release
          for f in *.bin; do sha256sum "$f" > "$f.sha256"; done
          cd ..
          cp partitions.csv release/partitions.csv
          ls -l release/

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [version]" to the next "## [" or "---" or end of file
          BODY=$(awk "/^## \\[${VERSION}\\]/{found=1; next} found && /^(## \\[|---)/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release ${TAG}"
          fi
          echo "body<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            release/spoolsense_scanner_esp32dev.bin
            release/spoolsense_scanner_esp32s3zero.bin
            release/spoolsense_scanner_esp32s3devkitc.bin
            release/spoolsense_scanner_esp32c3.bin
            release/spoolsense_scanner_esp32c6.bin
            release/spoolsense_scanner_esp32c5.bin
            release/spoolsense_scanner_seeed_xiao_esp32c6.bin
            release/bootloader_esp32dev.bin
            release/bootloader_esp32s3zero.bin
            release/bootloader_esp32s3devkitc.bin
            release/bootloader_esp32c3.bin
            release/bootloader_esp32c6.bin
            release/bootloader_esp32c5.bin
            release/bootloader_seeed_xiao_esp32c6.bin
            release/partitions_esp32dev.bin
            release/partitions_esp32s3zero.bin
            release/partitions_esp32s3devkitc.bin
            release/partitions_esp32c3.bin
            release/partitions_esp32c6.bin
            release/partitions_esp32c5.bin
            release/partitions_seeed_xiao_esp32c6.bin
            release/*.sha256
            release/partitions.csv

      - name: Trigger web flasher update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          script: |
            github.rest.repos.createDispatchEvent({
              owner: 'SpoolSense',
              repo: 'spoolsense.org',
              event_type: 'firmware-released',
              client_payload: {
                tag: '${{ steps.changelog.outputs.tag }}'
              }
            })

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          # Use env vars + jq to avoid shell interpretation of backticks in changelog
          PAYLOAD=$(jq -n \
            --arg title "SpoolSense Scanner $RELEASE_TAG Released" \
            --arg url "https://github.com/SpoolSense/spoolsense_scanner/releases/tag/$RELEASE_TAG" \
            --arg desc "${CHANGELOG_BODY:0:4000}" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 3447003}]}')
          # Discord returns 204 on success; on 429 it sends retry_after. The
          # v1.8.0 announcement was silently dropped by a 0.3s rate limit —
          # retry with backoff and fail the step loudly if it never lands.
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /tmp/discord_resp -w "%{http_code}"               -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK")
            if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
              echo "Discord notified (HTTP $HTTP_CODE, attempt $attempt)"
              exit 0
            fi
            echo "Discord attempt $attempt failed (HTTP $HTTP_CODE): $(cat /tmp/discord_resp)"
            RETRY_AFTER=$(jq -r '.retry_after // 2' /tmp/discord_resp 2>/dev/null || echo 2)
            sleep "$(python3 -c "print(min(float('$RETRY_AFTER') + $attempt, 30))")"
          done
          echo "::error::Discord notification failed after 5 attempts"
          exit 1
