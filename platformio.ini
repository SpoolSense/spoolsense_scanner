; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; Exact pioarduino pin: Arduino-ESP32 3.3.9 / ESP-IDF 5.5.4.
; Official PlatformIO remains on Arduino 2.0.17 and cannot build C5/C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
build_type = release
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/gen_gzip_assets.py
monitor_speed = 115200
monitor_filters = direct, printable
build_flags =
	-DFIRMWARE_VERSION=\"1.10.1\"
; Exact pins (#216): caret ranges let fresh checkouts resolve newer libraries
; than tested builds — same commit, different binary. Bump pins deliberately,
; in their own commit, with all four envs built.
lib_deps =
	marcoschwartz/LiquidCrystal_I2C@1.1.4
	bblanchon/ArduinoJson@7.4.3
	densaugeo/base64@1.4.0
	knolleary/PubSubClient@2.8
	; htcw_json + htcw_io + htcw_bits are vendored in lib/ — the registry
	; deleted the pinned 0.2.5 release (2026-09-06 CI outage; only 0.2.7
	; remained) and the streaming-parser semantics are validated against
	; exactly 0.2.5. Do not re-add a registry dependency for them.
	adafruit/Adafruit NeoPixel@1.15.4
	adafruit/Adafruit PN532@1.3.4
	chris--a/Keypad@3.1.1
	lovyan03/LovyanGFX@1.2.21

[env:esp32dev]
board = esp32dev

[env:esp32s3zero]
board = esp32-s3-devkitc-1
board_build.cdc_on_boot = 1
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_upload.flash_size = 4MB
build_flags =
	${env.build_flags}
	-DBOARD_ESP32_S3=1
	-DPN5180_SPI_BUS=HSPI  ; TFT owns SPI2 on the Zero; PN5180 takes SPI3
	-DBOARD_S3_ZERO=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_upload.flash_size = 4MB
build_flags =
	${env.build_flags}
	-DBOARD_ESP32_C3=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3devkitc]
board = esp32-s3-devkitc-1
board_build.cdc_on_boot = 1
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram = enabled
build_flags =
	${env.build_flags}
	-DBOARD_ESP32_S3=1
	-DBOARD_S3_DEVKITC=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM=1

[env:esp32c6]
board = esp32-c6-devkitc-1
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
# Shared-bus derating: with a TFT loading the same SCK/MOSI, the PN5180 at its
# 7 MHz max corrupted ~14-39% of UID reads on a C6 bench rig (FF-truncated and
# bit-flipped UIDs) while 3.5 MHz read 84/84 clean. Transfers are tiny, so the
# throughput cost is microseconds per scan. Dedicated-bus boards keep 7 MHz.
build_flags =
	${env.build_flags}
	-DBOARD_ESP32_C6=1
	-DBOARD_SHARED_SPI=1
	-DBOARD_NO_KEYPAD=1
	-DPN5180_SPI_HZ=3500000
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c5]
board = esp32-c5-devkitc-1
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
# LovyanGFX 1.2.21 has no ESP32-C5 profile; a fail-closed build-time patch
# aliases C5 onto the C6 register branches per upstream issue #700 (their
# sanctioned path). Compile-proven; hardware validation pending on a real C5.
extra_scripts =
	${env.extra_scripts}
	pre:scripts/patch_lovyangfx_c5.py
# Same shared-bus PN5180 derating as esp32c6 — see that env's comment.
build_flags =
	${env.build_flags}
	-DBOARD_ESP32_C5=1
	-DBOARD_SHARED_SPI=1
	-DBOARD_NO_KEYPAD=1
	-DPN5180_SPI_HZ=3500000
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
